# dsh-iot-studio bundle patch.
# Mounts one plugin that contributes the IoT device-control methodology skill and
# registers the five brand-neutral iot_* tools (list devices, read spec, get/set
# properties, call actions). Devices are discovered live from the brand cloud
# account, so newly paired hardware needs no configuration; new brands attach by
# registering an IotBrandProvider. Built-in brand: xiaomi, whose credentials come
# from this config block or XIAOMI_USERNAME / XIAOMI_PASSWORD; the service token
# cache lives under stateDir and is never logged.

- insert:
    - id: iot-studio
      name: 'dsh-iot-studio'
      config:
        defaultBrand: xiaomi
        xiaomi:
          username: ''
          password: ''
          serverCountry: cn
          stateDir: ''
          httpTimeoutSec: 15
